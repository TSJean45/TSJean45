<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30" width="900" height="30" role="img" aria-label="divider">
<defs>
  <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f2c14e" stop-opacity="0"/>
    <stop offset="22%" stop-color="#1fa3a0" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#f2c14e" stop-opacity="1"/>
    <stop offset="78%" stop-color="#a55ce0" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#ff5fa2" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="dsw" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff6dc" stop-opacity="1"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <path id="s" d="M0,-6 Q0.9,-0.9 6,0 Q0.9,0.9 0,6 Q-0.9,0.9 -6,0 Q-0.9,-0.9 0,-6"/>
  <filter id="g" x="-70%" y="-300%" width="240%" height="700%">
    <feGaussianBlur stdDeviation="2.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- travelling wavelet band -->
<g opacity="0.55">
  <path d="M0,22 Q56,14 112,22 T224,22 T336,22 T448,22 T560,22 T672,22 T784,22 T896,22 T1008,22"
        fill="none" stroke="#3fd8d0" stroke-width="1.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" from="-224,0" to="0,0" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M0,26 Q56,20 112,26 T224,26 T336,26 T448,26 T560,26 T672,26 T784,26 T896,26 T1008,26"
        fill="none" stroke="#f2c14e" stroke-width="1.1" stroke-linecap="round" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-224,0" dur="9s" repeatCount="indefinite"/>
  </path>
</g>

<line x1="0" y1="13" x2="900" y2="13" stroke="url(#dl)" stroke-width="1.2"/>

<rect x="-180" y="11.3" width="180" height="3.4" fill="url(#dsw)" filter="url(#g)">
  <animate attributeName="x" values="-180;900" dur="3.6s" repeatCount="indefinite"/>
</rect>

<!-- centre: spinning gold chip flanked by glitter -->
<g filter="url(#g)">
  <ellipse cx="450" cy="13" rx="9" ry="9" fill="#f2c14e">
    <animate attributeName="rx" values="9;1;9;1;9" dur="4.2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="13" rx="5" ry="5" fill="none" stroke="#7a4d10" stroke-width="1.1" opacity="0.7">
    <animate attributeName="rx" values="5;0.6;5;0.6;5" dur="4.2s" repeatCount="indefinite"/>
  </ellipse>

  <g transform="translate(408,13)"><use href="#s" fill="#3fd8d0">
    <animateTransform attributeName="transform" type="scale" values="0;0.85;0" dur="2.6s" repeatCount="indefinite"/>
  </use></g>
  <g transform="translate(492,13)"><use href="#s" fill="#ff5fa2">
    <animateTransform attributeName="transform" type="scale" values="0;0.85;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </use></g>
  <g transform="translate(360,11)"><use href="#s" fill="#fff6dc">
    <animateTransform attributeName="transform" type="scale" values="0;0.55;0" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
  </use></g>
  <g transform="translate(540,11)"><use href="#s" fill="#a55ce0">
    <animateTransform attributeName="transform" type="scale" values="0;0.55;0" dur="3.4s" begin="2.1s" repeatCount="indefinite"/>
  </use></g>
</g>
</svg>
